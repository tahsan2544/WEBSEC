[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'portfolio-security-auditor'
version = '3.0.0'
description = 'Defensive, read-only security, SEO, accessibility and performance upgrade auditor.'
readme = 'README.md'
requires-python = '>=3.10'
license = {file = 'LICENSE'}

[project.scripts]
portfolio-security-auditor = 'portfolio_security_auditor.cli:main'

[tool.setuptools.packages.find]
include = ['portfolio_security_auditor*']
